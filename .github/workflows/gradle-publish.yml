name: Gradle Package

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    # 1. 升级为 v4 版本，解决 Node.js 20 弃用警告
    - uses: actions/checkout@v4
    
    # 2. 升级为 v4 版本，解决 Node.js 20 弃用警告
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        server-id: github
        settings-path: ${{ github.workspace }}

    # 3. 关键修复：赋予 gradlew 执行权限（解决红色报错）
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. 建议将 gradle-build-action 升级到较新版本（如 v2 或 v3，此处保留你原先的 hash 也可以，但升级更好）
    - name: Build with Gradle
      uses: gradle/gradle-build-action@v3
      with:
        arguments: build

    - name: Publish to GitHub Packages
      uses: gradle/gradle-build-action@v3
      with:
        arguments: publish
      env:
        USERNAME: ${{ github.actor }}
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
