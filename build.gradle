subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    group = 'net.foxmcloud.clientresetpacket'
    version = '0.3.1'

    java.toolchain.languageVersion = JavaLanguageVersion.of(17)

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

    repositories {
        mavenCentral()
    }

    task versionedRelease(type: Copy) {
        group "build"
        from('./build/libs/forge-' + project.version + '.jar')
        into('../release/')
        include '*.jar'
        rename { String filename ->
            // P1-08 补充：成品 jar 统一命名为 HFCfastserverforge-{version}.jar
            filename.replace("forge-${project.version}.jar", "HFCfastserverforge-${project.version}.jar")
        }
    }
}
